name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run check:versions
      - run: npm run build
      - run: npm run pack:skill
      # Packs and validates the .mcpb (no Shamela needed). Real-library checks
      # run with `npm run selftest` on a machine that has Shamela installed.
      - run: npm run pack:mcpb
        if: matrix.node == 22
